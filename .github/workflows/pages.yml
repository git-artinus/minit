name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'resources/brand/**'
      - '.github/workflows/pages.yml'
  # 릴리즈를 발행하면 다운로드 버튼과 Changelog가 자동으로 최신화된다.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 진행 중인 배포를 죽이지 않고 큐에 쌓는다. GitHub 공식 Pages 스타터
  # 워크플로(actions/starter-workflows/pages/static.yml)가 같은 이유로 false를
  # 쓴다 — push 배포가 도는 중에 release:published 가 겹치면 true는 배포를
  # 중간에 끊어 Pages를 부분 상태로 남길 수 있다.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 레이트리밋 60/h → 1000/h
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
