name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'resources/brand/**'
      - '.github/workflows/pages.yml'
  # 릴리즈를 발행하면 다운로드 버튼과 Changelog가 자동으로 최신화된다.
  #
  # 주의(v0.10.0에서 실제로 겪음): 이 이벤트의 ref는 refs/tags/<tag>라서, github-pages
  # 환경의 배포 정책에 태그가 없으면 build는 통과하고 deploy만 거부된다
  # ("Tag ... is not allowed to deploy to github-pages due to environment protection
  # rules"). 그러면 릴리즈는 게시됐는데 사이트는 옛 버전을 계속 내려주고, 아무도
  # 알아채지 못한다. 환경 정책에 `v*`(type: tag)가 남아 있어야 한다 —
  #   gh api repos/git-artinus/minit/environments/github-pages/deployment-branch-policies
  # 로 확인하고, 없으면 -f name='v*' -f type='tag' 로 다시 추가한다.
  # (배포되는 내용은 아래 checkout이 main을 명시하므로 태그 시점 스냅샷이 아니다.)
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 진행 중인 배포를 죽이지 않고 큐에 쌓는다. GitHub 공식 Pages 스타터
  # 워크플로(actions/starter-workflows/pages/static.yml)가 같은 이유로 false를
  # 쓴다 — push 배포가 도는 중에 release:published 가 겹치면 true는 배포를
  # 중간에 끊어 Pages를 부분 상태로 남길 수 있다.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # release:published 이벤트에서 github.sha는 "태그된 릴리즈의 마지막 커밋"이고
          # ref는 refs/tags/<tag>다(GitHub 공식 문서, Events that trigger workflows).
          # ref를 안 주면 actions/checkout이 그 태그 커밋을 체크아웃해 Pages를
          # 릴리즈 시점 스냅샷으로 되돌려버린다. push/workflow_dispatch는 원래도
          # main 기준이라 동작이 바뀌지 않는다.
          ref: ${{ github.event.repository.default_branch }}
          # 사이트 빌드에 필요한 것만 받는다. 앱 tsconfig를 디스크에 두지 않는 것이
          # 핵심이다 — Vite는 워크스페이스 루트(=git 루트) 아래 tsconfig를 스캔·파싱하는데,
          # 루트 tsconfig.json 이 references로 tsconfig.node.json 을 가리키고 그것이
          # @electron-toolkit/tsconfig 를 extends 한다. 이 워크플로는 site/ 에서만
          # npm ci 하므로 그 패키지가 없어 "Tsconfig not found" 로 빌드가 죽는다.
          # 루트 npm ci 로 해결하면 electron 등 514MB를 받아야 하고 격리도 깨진다.
          # cone 모드는 최상위 파일을 항상 포함하므로 반드시 꺼야 한다.
          sparse-checkout: |
            site/
            resources/brand/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      # 릴리즈 발행 이벤트는 목록 API 반영보다 먼저 온다(v0.14.0에서 실제로 겪음 — 발행
      # 06:33:39Z, 빌드 시작 06:33에 목록이 아직 이전 릴리즈까지만 나와 changelog가 한 버전
      # 뒤처진 채로 배포됐다). 빌드·배포는 성공으로 끝나 아무도 알아채지 못한다.
      # 이벤트 페이로드의 태그가 목록 API에 나타날 때까지 기다렸다가 빌드한다.
      - name: 릴리즈가 목록 API에 반영될 때까지 대기
        if: github.event_name == 'release'
        env:
          # 워크플로 표현식을 run 안에 직접 보간하지 않는다(셸 주입 방지 관례).
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/$REPO/releases?per_page=100" \
                 --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
               | grep -qx "$TAG"; then
              echo "$TAG 반영 확인 (${i}회차)"
              exit 0
            fi
            echo "$TAG 아직 목록에 없음 — 10초 후 재시도 ($i/30)"
            sleep 10
          done
          echo "::error::$TAG 가 릴리즈 목록 API에 5분 내로 반영되지 않았다. 사이트를 옛 목록으로 굽지 않도록 중단한다."
          exit 1
      - run: npm run build
        env:
          # 레이트리밋 60/h → 1000/h
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 위 대기를 통과해도 빌드가 읽는 API 응답이 캐시 노드에 따라 다를 수 있다. 실제 산출물에
      # 해당 버전이 들어갔는지 확인해, 누락되면 조용히 배포하지 않고 실패시킨다.
      - name: 산출물에 릴리즈 버전이 포함됐는지 확인
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! grep -qF "id=\"$TAG\"" dist/changelog/index.html; then
            echo "::error::$TAG 가 changelog 산출물에 없다. 옛 목록으로 빌드된 것이므로 배포하지 않는다."
            exit 1
          fi
          echo "$TAG 가 changelog 산출물에 포함됨"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
