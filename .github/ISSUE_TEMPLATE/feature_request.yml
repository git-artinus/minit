name: 기능 제안
description: 있었으면 하는 기능을 알려주세요
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 불편한가요
      description: |
        기능보다 **불편한 상황**을 먼저 알려주시면 더 나은 방법을 찾을 수 있습니다.
      placeholder: 회의록을 팀원에게 공유할 때마다 파일을 직접 찾아 들어가야 합니다.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 어떻게 되면 좋을까요
      description: 떠오르는 방식이 있다면 적어주세요. 없어도 괜찮습니다.

  - type: textarea
    id: extra
    attributes:
      label: 그 밖에
      description: 지금은 어떻게 우회하고 계신지, 얼마나 자주 겪으시는지 알려주시면 우선순위를 정하는 데 도움이 됩니다.
