name: 버그 신고
description: 동작하지 않거나 이상하게 동작하는 것을 알려주세요
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        먼저 [문제 해결 문서](https://git-artinus.github.io/minit/docs/troubleshooting/)에
        같은 증상이 있는지 확인해 주세요. 대부분 거기서 해결됩니다.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 하려다가 어떻게 됐는지 편하게 적어주세요. 개발 용어를 쓰지 않으셔도 됩니다.
      placeholder: 회의를 끝냈는데 요약이 안 나오고 받아쓴 내용만 남았습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 어떻게 하면 다시 일어나나요
      description: 순서대로 적어주시면 확인이 빨라집니다. 모르셔도 괜찮습니다.
      placeholder: |
        1. 회의 시작을 누른다
        2. 3분쯤 녹음한다
        3. 회의 종료를 누른다

  - type: input
    id: version
    attributes:
      label: Minit 버전
      description: 설정(톱니 아이콘) 하단에서 볼 수 있습니다
      placeholder: v0.9.0
    validations:
      required: true

  - type: dropdown
    id: mac
    attributes:
      label: Mac 종류
      description: 애플 메뉴 → 이 Mac에 관하여에서 확인할 수 있습니다
      options:
        - Apple Silicon (M1 이상)
        - Intel
        - 모르겠음
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 그 밖에
      description: 화면 캡처를 붙이시면 큰 도움이 됩니다. 회의 내용이 보이지 않게 가려주세요.
